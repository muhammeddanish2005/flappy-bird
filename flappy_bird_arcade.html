<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background: #1a1a1a;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive, sans-serif;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen bg-slate-900">

    <div id="game-container" class="relative w-full max-w-[480px] h-[100dvh] sm:h-[720px] bg-sky-300 shadow-2xl flex flex-col items-center justify-center overflow-hidden sm:rounded-2xl border-4 border-slate-700">
        
        <!-- Game Canvas -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full cursor-pointer"></canvas>

        <!-- HUD: Score -->
        <div id="hud" class="absolute top-8 z-10 text-white text-3xl sm:text-4xl drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] pointer-events-none hidden">
            0
        </div>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-between py-16 px-6 bg-black/40 backdrop-blur-[2px] text-white">
            <div class="text-center mt-6">
                <h1 class="text-3xl sm:text-4xl text-yellow-400 drop-shadow-[0_4px_0_#b45309] leading-tight animate-bounce">FLAPPY BIRD</h1>
                <p class="text-xs text-sky-200 mt-3 drop-shadow">ARCADE EDITION</p>
            </div>

            <div class="flex flex-col items-center gap-4 bg-slate-900/80 border-4 border-slate-600 p-6 rounded-xl shadow-2xl w-full max-w-xs">
                <div class="flex items-center justify-between w-full text-xs text-slate-300">
                    <span>HIGH SCORE</span>
                    <span id="start-high-score" class="text-yellow-400 text-sm">0</span>
                </div>
                <button id="start-btn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-white text-sm font-bold rounded-lg border-b-4 border-emerald-700 transition transform shadow-lg cursor-pointer">
                    PLAY GAME
                </button>
                <p class="text-[10px] text-slate-400 text-center mt-2">Tap Screen, Click, or Press SPACE to Flap</p>
            </div>

            <div class="text-[10px] text-slate-300 opacity-80">
                Created with HTML5 Canvas & Web Audio
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="game-over-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-black/60 backdrop-blur-sm text-white hidden">
            <div class="bg-slate-900 border-4 border-slate-600 p-6 rounded-2xl shadow-2xl w-full max-w-xs flex flex-col items-center animate-fade-in">
                <h2 class="text-2xl text-red-500 drop-shadow-[0_3px_0_#7f1d1d] mb-6">GAME OVER</h2>
                
                <div class="w-full bg-slate-800 border-2 border-slate-700 rounded-lg p-4 mb-6 flex flex-col gap-3">
                    <div class="flex justify-between items-center text-xs text-slate-300">
                        <span>SCORE</span>
                        <span id="final-score" class="text-white text-base">0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-slate-300">
                        <span>BEST</span>
                        <span id="final-best" class="text-yellow-400 text-base">0</span>
                    </div>
                </div>

                <button id="restart-btn" class="w-full py-4 bg-amber-500 hover:bg-amber-400 active:scale-95 text-white text-sm font-bold rounded-lg border-b-4 border-amber-700 transition transform shadow-lg cursor-pointer">
                    TRY AGAIN
                </button>
            </div>
        </div>

    </div>

    <script>
        // Web Audio API Sound Synthesizer
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Audio context blocked or unsupported
                }
            }
            flap() {
                this.playTone(400, 'sine', 0.1, 0.15);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.1), 50);
            }
            score() {
                this.playTone(587.33, 'triangle', 0.15, 0.2); // D5
                setTimeout(() => this.playTone(880, 'triangle', 0.2, 0.2), 100); // A5
            }
            hit() {
                this.playTone(150, 'sawtooth', 0.3, 0.25);
                setTimeout(() => this.playTone(80, 'sawtooth', 0.4, 0.3), 100);
            }
        }

        const sound = new SoundEngine();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const container = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreDisplay = document.getElementById('hud');
        const finalScoreEl = document.getElementById('final-score');
        const finalBestEl = document.getElementById('final-best');
        const startHighScoreEl = document.getElementById('start-high-score');

        // Logical game dimensions
        const LOGICAL_WIDTH = 400;
        const LOGICAL_HEIGHT = 600;

        let scale = 1;
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            scale = rect.width / LOGICAL_WIDTH;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game States: 'START', 'PLAYING', 'GAMEOVER'
        let gameState = 'START';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_high_score') || '0', 10);
        startHighScoreEl.textContent = highScore;

        // Game Entities
        let bird = {
            x: 80,
            y: LOGICAL_HEIGHT / 2,
            radius: 16,
            velocity: 0,
            gravity: 0.38,
            lift: -7.2,
            rotation: 0
        };

        let pipes = [];
        let pipeWidth = 64;
        let pipeGap = 160;
        let pipeSpeed = 3.2;
        let frameCount = 0;

        // Background elements (clouds, hills)
        let clouds = [
            { x: 50, y: 100, speed: 0.5, size: 40 },
            { x: 250, y: 180, speed: 0.4, size: 60 },
            { x: 380, y: 80, speed: 0.6, size: 50 }
        ];

        let groundX = 0;
        const groundHeight = 90;

        // Input Handlers
        function triggerFlap(e) {
            if (e) e.preventDefault();
            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'PLAYING') {
                bird.velocity = bird.lift;
                sound.flap();
            } else if (gameState === 'GAMEOVER') {
                // Prevent immediate restart on same tap if desired, or allow quick restart
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                triggerFlap(e);
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            triggerFlap(e);
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        function startGame() {
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            resetEntities();
            sound.init();
        }

        function resetEntities() {
            bird.y = LOGICAL_HEIGHT / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            scoreDisplay.textContent = score;
            frameCount = 0;
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            hud.classList.add('hidden');
            sound.hit();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_high_score', highScore);
            }

            finalScoreEl.textContent = score;
            finalBestEl.textContent = highScore;
            startHighScoreEl.textContent = highScore;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            resetEntities();
            gameState = 'PLAYING';
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
        }

        // Spawn Pipe Function
        function spawnPipe() {
            const minHeight = 60;
            const maxHeight = LOGICAL_HEIGHT - groundHeight - pipeGap - 80;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: LOGICAL_WIDTH,
                top: topHeight,
                bottom: LOGICAL_HEIGHT - groundHeight - topHeight - pipeGap,
                passed: false
            });
        }

        // Update Game Logic
        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;

            // Spawn pipes periodically
            if (frameCount % 95 === 0) {
                spawnPipe();
            }

            // Move clouds
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -100) cloud.x = LOGICAL_WIDTH + 50;
            });

            // Move ground
            groundX = (groundX + pipeSpeed) % LOGICAL_WIDTH;

            // Bird physics
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Bird rotation based on velocity
            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity / 12) * (Math.PI / 2)));

            // Floor & Ceiling collision
            if (bird.y + bird.radius >= LOGICAL_HEIGHT - groundHeight) {
                bird.y = LOGICAL_HEIGHT - groundHeight - bird.radius;
                triggerGameOver();
            }
            if (bird.y - bird.radius <= 0) {
                bird.y = bird.radius;
                bird.velocity = 0;
            }

            // Pipe update & collision
            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                // Score check
                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    sound.score();
                }

                // Collision detection (AABB vs Circle or simplified box)
                // Bird box bounds
                let bLeft = bird.x - bird.radius + 6;
                let bRight = bird.x + bird.radius - 6;
                let bTop = bird.y - bird.radius + 6;
                let bBottom = bird.y + bird.radius - 6;

                // Top pipe rect
                let topPipeRect = { x: p.x, y: 0, w: pipeWidth, h: p.top };
                // Bottom pipe rect
                let bottomPipeRect = { x: p.x, y: LOGICAL_HEIGHT - groundHeight - p.bottom, w: pipeWidth, h: p.bottom };

                if (rectIntersect(bLeft, bTop, bRight - bLeft, bBottom - bTop, topPipeRect.x, topPipeRect.y, topPipeRect.w, topPipeRect.h) ||
                    rectIntersect(bLeft, bTop, bRight - bLeft, bBottom - bTop, bottomPipeRect.x, bottomPipeRect.y, bottomPipeRect.w, bottomPipeRect.h)) {
                    triggerGameOver();
                }

                // Remove off-screen pipes
                if (p.x + pipeWidth < -50) {
                    pipes.splice(i, 1);
                }
            }
        }

        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        // Render Graphics on Canvas
        function draw() {
            // Clear canvas using logical dimensions scaled
            ctx.save();
            ctx.scale(scale, scale);

            // 1. Sky Background (Gradient)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
            skyGrad.addColorStop(0, '#38bdf8');
            skyGrad.addColorStop(1, '#bae6fd');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

            // 2. Draw Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size * 0.5, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.4, c.y - c.size * 0.2, c.size * 0.35, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.8, c.y, c.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Draw Pipes
            pipes.forEach(p => {
                // Pipe Body Colors
                const pipeGreen = '#22c55e';
                const pipeDark = '#15803d';
                const pipeLight = '#4ade80';
                const lipHeight = 24;

                // Top Pipe Body
                ctx.fillStyle = pipeGreen;
                ctx.fillRect(p.x + 4, 0, pipeWidth - 8, p.top - lipHeight);
                ctx.fillStyle = pipeDark;
                ctx.fillRect(p.x + pipeWidth - 12, 0, 8, p.top - lipHeight);
                ctx.fillStyle = pipeLight;
                ctx.fillRect(p.x + 4, 0, 8, p.top - lipHeight);

                // Top Pipe Lip
                ctx.fillStyle = pipeGreen;
                ctx.fillRect(p.x, p.top - lipHeight, pipeWidth, lipHeight);
                ctx.strokeStyle = '#14532d';
                ctx.lineWidth = 3;
                ctx.strokeRect(p.x, p.top - lipHeight, pipeWidth, lipHeight);
                ctx.fillStyle = pipeLight;
                ctx.fillRect(p.x + 4, p.top - lipHeight + 3, pipeWidth - 8, 4);

                // Bottom Pipe Lip
                let bPipeY = LOGICAL_HEIGHT - groundHeight - p.bottom;
                ctx.fillStyle = pipeGreen;
                ctx.fillRect(p.x, bPipeY, pipeWidth, lipHeight);
                ctx.strokeStyle = '#14532d';
                ctx.lineWidth = 3;
                ctx.strokeRect(p.x, bPipeY, pipeWidth, lipHeight);
                ctx.fillStyle = pipeLight;
                ctx.fillRect(p.x + 4, bPipeY + 3, pipeWidth - 8, 4);

                // Bottom Pipe Body
                ctx.fillStyle = pipeGreen;
                ctx.fillRect(p.x + 4, bPipeY + lipHeight, pipeWidth - 8, p.bottom - lipHeight);
                ctx.fillStyle = pipeDark;
                ctx.fillRect(p.x + pipeWidth - 12, bPipeY + lipHeight, 8, p.bottom - lipHeight);
                ctx.fillStyle = pipeLight;
                ctx.fillRect(p.x + 4, bPipeY + lipHeight, 8, p.bottom - lipHeight);
            });

            // 4. Draw Ground
            const groundY = LOGICAL_HEIGHT - groundHeight;
            // Grass strip
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(0, groundY, LOGICAL_WIDTH, 16);
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, groundY + 12, LOGICAL_WIDTH, 4);

            // Dirt/Brick pattern below grass
            ctx.fillStyle = '#d97706';
            ctx.fillRect(0, groundY + 16, LOGICAL_WIDTH, groundHeight - 16);
            
            // Retro ground stripes
            ctx.fillStyle = '#b45309';
            for (let i = -groundX; i < LOGICAL_WIDTH + 40; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, groundY + 16);
                ctx.lineTo(i + 15, LOGICAL_HEIGHT);
                ctx.lineTo(i + 25, LOGICAL_HEIGHT);
                ctx.lineTo(i + 10, groundY + 16);
                ctx.fill();
            }

            // Ground border line
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(LOGICAL_WIDTH, groundY);
            ctx.stroke();

            // 5. Draw Bird
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            // Bird Body (Yellow Circle with outline)
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#713f12';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Belly patch
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(-2, 4, bird.radius * 0.6, 0, Math.PI);
            ctx.fill();

            // Wing
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.ellipse(-4, 2, 8, 5, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ca8a04';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Eye (White with black pupil)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(6, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Beak (Orange triangle)
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(10, -2);
            ctx.lineTo(20, 2);
            ctx.lineTo(10, 6);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#c2410c';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();

            ctx.restore();
        }

        // Main Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start animation loop on window load
        window.onload = function() {
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
